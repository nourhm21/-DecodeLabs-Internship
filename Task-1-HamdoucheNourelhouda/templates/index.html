<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova : Rule-Based Chatbot (Python Powered)</title>
<style>
  :root{
    --bg: #0b1016;
    --panel: #10171e;
    --panel-2: #141d26;
    --line: #24323d;
    --cyan: #5fd8e6;
    --cyan-dim: #2c5a63;
    --amber: #e8a23d;
    --text: #e7edf2;
    --text-dim: #7f93a1;
    --danger: #e2604f;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }

  body {
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 34px 34px;
    background-position: center;
    background-color: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-y: auto;
  }

  .app {
    width: 100%;
    max-width: 460px;
    height: 720px;
    max-height: calc(100vh - 48px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(95,216,230,0.05), 0 30px 60px rgba(0,0,0,0.5);
    position: relative;
    flex-shrink: 0;
  }

  .head {
    padding: 18px 20px 16px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    position: relative;
  }

  .head .tag {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.12em;
    color: var(--cyan);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .head .tag .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .head h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .head p {
    margin: 4px 0 0;
    font-size: 12.5px;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .chat::-webkit-scrollbar { width: 6px; }
  .chat::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  .row { display: flex; }
  .row.bot { justify-content: flex-start; }
  .row.user { justify-content: flex-end; }

  .bubble {
    max-width: 78%;
    padding: 10px 13px;
    border-radius: 12px;
    font-size: 14.5px;
    line-height: 1.45;
    position: relative;
    animation: rise 0.22s ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .row.bot .bubble {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-bottom-left-radius: 3px;
    color: var(--text);
  }

  .row.user .bubble {
    background: rgba(232,162,61,0.14);
    border: 1px solid rgba(232,162,61,0.4);
    border-bottom-right-radius: 3px;
    color: #f4d9a8;
  }

  .label {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 3px;
  }

  .row.bot .label { color: var(--cyan-dim); }

  /* ---------- suggestions ---------- */
  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    padding: 4px 16px 14px;
    border-top: 1px solid var(--line);
    padding-top: 12px;
  }

  .chip {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--cyan);
    background: rgba(95,216,230,0.06);
    border: 1px solid var(--cyan-dim);
    border-radius: 20px;
    padding: 6px 13px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }

  .chip:hover {
    background: rgba(95,216,230,0.14);
    border-color: var(--cyan);
  }

  .chip:active { transform: scale(0.97); }

  /* ---------- input ---------- */
  .inputbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid var(--line);
    background: var(--panel-2);
  }

  .inputbar input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    padding: 11px 13px;
    font-size: 14px;
    font-family: var(--sans);
    outline: none;
    transition: border-color 0.15s;
  }

  .inputbar input:focus { border-color: var(--cyan-dim); }

  .inputbar button {
    background: var(--cyan);
    border: none;
    border-radius: 8px;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity 0.15s;
  }

  .inputbar button:hover { opacity: 0.85; }
  .inputbar button:active { transform: scale(0.95); }
  .inputbar button:disabled { opacity: 0.4; cursor: not-allowed; }

  .inputbar button svg { width: 18px; height: 18px; }

  .footnote {
    text-align: center;
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--text-dim);
    padding: 8px 0 12px;
    letter-spacing: 0.04em;
  }

  /* typing indicator dots */
  .typing .bubble { display: flex; align-items: center; gap: 4px; padding: 12px 14px; }
  .typing .dot-anim {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    animation: blink 1.1s infinite ease-in-out;
  }
  .typing .dot-anim:nth-child(2) { animation-delay: 0.15s; }
  .typing .dot-anim:nth-child(3) { animation-delay: 0.3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
</style>
</head>
<body>

<div class="app">
  <div class="head">
    <div class="tag"><span class="dot"></span>RULE-BASED · PYTHON (FLASK) BACKEND</div>
    <h1>{{ bot_name }}</h1>
  </div>

  <div class="chat" id="chat"></div>

  <div class="suggestions" id="suggestions"></div>

  <div class="inputbar">
    <input type="text" id="userInput" placeholder=" Write your message … (or click a suggestion)" >
    <button id="sendBtn" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0b1016" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
  <div class="footnote">type "bye" to reset · logic runs in Python on the server</div>
</div>

<script>
const BOT_NAME = "{{ bot_name }}";
const SUGGESTIONS = {{ suggestions | tojson }};
const GREETING = {{ greeting | tojson }};

const chat = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const suggestionsBar = document.getElementById("suggestions");

function addBubble(text, who) {
  const row = document.createElement("div");
  row.className = "row " + who;

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = who === "bot" ? BOT_NAME.toUpperCase() : "YOU";

  const body = document.createElement("div");
  body.textContent = text;

  bubble.appendChild(label);
  bubble.appendChild(body);
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function addTyping() {
  const row = document.createElement("div");
  row.className = "row bot typing";
  row.id = "typingRow";
  row.innerHTML = `
    <div class="bubble">
      <span class="dot-anim"></span><span class="dot-anim"></span><span class="dot-anim"></span>
    </div>`;
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const row = document.getElementById("typingRow");
  if (row) row.remove();
}

function renderSuggestions() {
  suggestionsBar.innerHTML = "";
  SUGGESTIONS.forEach(word => {
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.textContent = word;
    chip.onclick = () => handleSend(word);
    suggestionsBar.appendChild(chip);
  });
}

async function fetchBotReply(message) {
  const res = await fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message })
  });
  const data = await res.json();
  return data.reply;
}

async function handleSend(rawText) {
  const text = (rawText !== undefined ? rawText : input.value).trim();
  if (!text) return;

  addBubble(text, "user");
  input.value = "";
  sendBtn.disabled = true;
  addTyping();

  try {
    const reply = await fetchBotReply(text);
    removeTyping();
    addBubble(reply, "bot");
  } catch (err) {
    removeTyping();
    addBubble(" Couldn't reach the server. Is app.py running?", "bot");
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener("click", () => handleSend());
input.addEventListener("keydown", e => { if (e.key === "Enter") handleSend(); });

addBubble(GREETING, "bot");
renderSuggestions();
</script>

</body>
</html>
